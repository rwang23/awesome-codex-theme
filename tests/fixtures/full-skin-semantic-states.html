<!doctype html>
<html lang="en">
  <body>
    <main data-act-runtime-fixture="semantic-states-v1">
      <a href="#semantic-link" data-act-semantic-state="link">Native link</a>
      <p role="alert" data-act-semantic-state="error">Native error</p>
      <p data-act-semantic-state="warning">Native warning</p>
      <p data-act-semantic-state="success">Native success</p>
      <button disabled data-act-semantic-state="disabled">Disabled action</button>
      <button data-act-semantic-state="focus">Focusable action</button>
      <span data-act-semantic-state="selection">Selectable text</span>
      <pre data-act-semantic-state="diff-added">+ added line</pre>
      <pre data-act-semantic-state="diff-removed">- removed line</pre>
    </main>
  </body>
</html>
