version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/theme-manager
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /apps/theme-manager/src-tauri
    schedule:
      interval: weekly
