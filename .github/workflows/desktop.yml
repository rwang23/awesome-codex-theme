name: Verify theme artifacts, build Theme Manager, and publish gallery

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "apps/theme-manager/**"
      - "assets/**"
      - "docs/assets/**"
      - "index.html"
      - "installer/**"
      - "LICENSE"
      - "NOTICE.md"
      - "package.json"
      - "packages/**"
      - "schemas/**"
      - "scripts/**"
      - "screenshots/**"
      - "site/**"
      - "tests/**"
      - "themes/**"
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "apps/theme-manager/**"
      - "assets/**"
      - "docs/assets/**"
      - "index.html"
      - "installer/**"
      - "LICENSE"
      - "NOTICE.md"
      - "package.json"
      - "packages/**"
      - "schemas/**"
      - "scripts/**"
      - "screenshots/**"
      - "site/**"
      - "tests/**"
      - "themes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Generate and validate canonical artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate, validate, and test public artifacts once
        run: npm run test:ci

      - name: Prepare desktop assets once
        run: npm run desktop:prepare

      - name: Upload generated artifact set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: act-generated-theme-assets
          path: |
            themes/registry.json
            themes/*/manifest.json
            themes/*/assets/**
            themes/*/previews/**
            screenshots/*/presentation/**
            packages/**
            apps/theme-manager/build/**
          retention-days: 2
          if-no-files-found: error

  a11y:
    name: Verify Theme Manager accessibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install accessibility test dependencies
        run: npm ci --prefix apps/theme-manager

      - name: Assert Theme Manager accessibility in Chromium
        env:
          ACT_CHROME_BIN: google-chrome
        run: npm run a11y:check --prefix apps/theme-manager

  desktop:
    name: Desktop ${{ matrix.os }} ${{ matrix.rust-target || 'native' }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-target: ""
            build-args: "--bundles nsis"
            artifact: Awesome-Codex-Theme-Windows-x64
            artifact-path: apps/theme-manager/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-14
            rust-target: aarch64-apple-darwin
            build-args: "--target aarch64-apple-darwin --bundles app,dmg"
            artifact: Awesome-Codex-Theme-macOS-Apple-Silicon
            artifact-path: apps/theme-manager/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-14
            rust-target: x86_64-apple-darwin
            build-args: "--target x86_64-apple-darwin --bundles app,dmg"
            artifact: Awesome-Codex-Theme-macOS-Intel
            artifact-path: apps/theme-manager/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download generated artifact set
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: act-generated-theme-assets
          path: .

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Validate Windows portable helper
        if: runner.os == 'Windows'
        run: npm run installer:validate

      - name: Install desktop dependencies
        run: npm ci --prefix apps/theme-manager

      - name: Test the Rust catalog and command boundary
        run: npm run desktop:check

      - name: Build platform-untrusted CI artifact
        working-directory: apps/theme-manager
        run: npm run tauri -- build ${{ matrix.build-args }}

      - name: Verify macOS disk image, bundle identity, and ad-hoc signature
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          dmg_dir="apps/theme-manager/src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg"
          shopt -s nullglob
          artifacts=("$dmg_dir"/*.dmg)
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one macOS DMG, found ${#artifacts[@]}."
            exit 1
          fi

          dmg="${artifacts[0]}"
          hdiutil verify "$dmg"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rm -rf "$mount_dir"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"

          apps=("$mount_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one macOS application bundle."
            exit 1
          fi
          app_path="${apps[0]}"

          info_plist="$app_path/Contents/Info.plist"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")"
          if [ "$bundle_id" != "io.github.rwang23.awesomecodextheme" ]; then
            echo "::error::Unexpected macOS bundle identifier: $bundle_id"
            exit 1
          fi

          executable="$app_path/Contents/MacOS/$executable_name"
          if [ ! -x "$executable" ]; then
            echo "::error::The declared macOS executable is missing or not executable."
            exit 1
          fi

          architectures="$(lipo -archs "$executable")"
          case "${{ matrix.rust-target }}" in
            aarch64-apple-darwin) expected_architecture="arm64" ;;
            x86_64-apple-darwin) expected_architecture="x86_64" ;;
            *)
              echo "::error::Unexpected Rust target: ${{ matrix.rust-target }}"
              exit 1
              ;;
          esac
          if ! grep -qw "$expected_architecture" <<<"$architectures"; then
            echo "::error::Expected $expected_architecture but found: $architectures"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          signing_details="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          if ! grep -q "^Signature=adhoc$" <<<"$signing_details"; then
            echo "::error::Expected an ad-hoc macOS signature."
            echo "$signing_details"
            exit 1
          fi

      - name: Upload platform-untrusted CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  pages:
    name: Build and verify gallery
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download generated artifact set
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: act-generated-theme-assets
          path: .

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build gallery from the canonical artifact set
        run: npm run build

      - name: Assert live gallery behavior in Chromium
        run: npm run gallery:check -- --screenshot gallery-home.png

      - name: Upload gallery screenshot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gallery-screenshot
          path: gallery-home.png
          if-no-files-found: warn

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  release:
    if: startsWith(github.ref, 'refs/tags/v') && vars.DESKTOP_RELEASE_READY == 'true'
    needs:
      - prepare
      - desktop
    name: Release ${{ matrix.os }} ${{ matrix.rust-target || 'native' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-target: ""
            build-args: "--bundles nsis"
            release-asset-name: Awesome-Codex-Theme-[version]-Windows-x64[setup][ext]
          - os: macos-14
            rust-target: aarch64-apple-darwin
            build-args: "--target aarch64-apple-darwin --bundles app,dmg"
            release-asset-name: Awesome-Codex-Theme-[version]-macOS-Apple-Silicon[ext]
          - os: macos-14
            rust-target: x86_64-apple-darwin
            build-args: "--target x86_64-apple-darwin --bundles app,dmg"
            release-asset-name: Awesome-Codex-Theme-[version]-macOS-Intel[ext]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download generated artifact set
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: act-generated-theme-assets
          path: .

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install desktop dependencies
        run: npm ci --prefix apps/theme-manager

      - name: Check updater release credentials
        shell: bash
        env:
          ACT_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in ACT_UPDATER_PUBKEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for signed updater artifacts."
              exit 1
            fi
          done

      - name: Verify release tag matches metadata
        if: startsWith(github.ref, 'refs/tags/v') && vars.DESKTOP_RELEASE_READY == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v0.3.2"

      - name: Build updater-signed beta artifacts and publish the tagged release
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACT_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/theme-manager
          args: "--config src-tauri/tauri.release.conf.json ${{ matrix.build-args }}"
          tagName: ${{ github.ref_name }}
          releaseName: "Awesome Codex Theme v0.3.2 Beta"
          releaseAssetNamePattern: ${{ matrix.release-asset-name }}
          releaseBody: "Updater-signed Tauri Theme Manager beta with ACT Full Skin v1. Windows Authenticode and Apple Developer ID signing/notarization are not included in this beta, so the operating system may show an unknown-publisher warning. macOS bundles carry an ad-hoc signature for package integrity only. The app applies verified backgrounds, materials, colors, and theme copy without modifying ChatGPT application files."
          prerelease: true
          releaseDraft: true

      - name: Verify release macOS disk image and ad-hoc signature
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          dmg_dir="apps/theme-manager/src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg"
          shopt -s nullglob
          artifacts=("$dmg_dir"/*.dmg)
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release DMG, found ${#artifacts[@]}."
            exit 1
          fi

          dmg="${artifacts[0]}"
          hdiutil verify "$dmg"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rm -rf "$mount_dir"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          apps=("$mount_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one macOS application bundle."
            exit 1
          fi
          app_path="${apps[0]}"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          signing_details="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          if ! grep -q "^Signature=adhoc$" <<<"$signing_details"; then
            echo "::error::Expected an ad-hoc macOS signature."
            echo "$signing_details"
            exit 1
          fi

          updater_dir="apps/theme-manager/src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos"
          updater_archives=("$updater_dir"/*.app.tar.gz)
          if [ "${#updater_archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one macOS updater archive."
            exit 1
          fi
          updater_archive="${updater_archives[0]}"
          updater_signatures=("$updater_dir"/*.app.tar.gz.sig)
          if [ "${#updater_signatures[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one macOS updater signature."
            exit 1
          fi
          updater_signature="${updater_signatures[0]}"
          test -s "$updater_archive"
          test -s "$updater_signature"
